[package]
name = "solmu-harness"
version = "0.0.0"
edition = "2024"

# Portable Beeper adapter checks stage current sources via check_adapter.py
# and stub only unrelated UI/platform leaves. Full native tests run in CI.

[dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
base64 = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
directories = "6"
jiff = "0.2"
fastframe_shell = { path = "stubs/fastframe_shell" }
log = "0.4"
fastframe-i18n = { git = "https://github.com/crmne/fastframe", tag = "v0.15.2" }
egui = { path = "stubs/egui" }
rfd = { path = "stubs/rfd" }
eframe = { path = "stubs/eframe" }
fastframe_file = { path = "stubs/fastframe_file" }

[build-dependencies]
fastframe-i18n = { git = "https://github.com/crmne/fastframe", tag = "v0.15.2", features = ["build"] }

[dev-dependencies]
tempfile = "3"
