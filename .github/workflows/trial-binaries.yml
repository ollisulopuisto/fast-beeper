name: Trial binaries

# Explicit compile/package route, not an alternative production release gate.
# No automatic duplicate release builds for PRs or main pushes.
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Urgent compile/package target; all is an explicit broad run'
        type: choice
        default: aarch64-apple-darwin
        options:
          - aarch64-apple-darwin
          - x86_64-apple-darwin
          - x86_64-unknown-linux-gnu
          - x86_64-pc-windows-msvc
          - all
          - shots-only

permissions:
  contents: read

concurrency:
  group: trial-binaries-${{ github.ref }}-${{ inputs.target }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  select:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - id: matrix
        env:
          TARGET: ${{ inputs.target }}
        run: |
          python3 - <<'PY'
          import json, os
          rows = [
              dict(os='macos-15', target='aarch64-apple-darwin', executable='solmu'),
              dict(os='macos-15-intel', target='x86_64-apple-darwin', executable='solmu'),
              dict(os='ubuntu-24.04', target='x86_64-unknown-linux-gnu', executable='solmu'),
              dict(os='windows-2025', target='x86_64-pc-windows-msvc', executable='solmu.exe'),
          ]
          selected = [r for r in rows if os.environ['TARGET'] in ('all', r['target'])]
          if not selected and os.environ['TARGET'] != 'shots-only':
              raise SystemExit('Unknown target; refusing build')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('matrix=' + json.dumps(dict(include=selected)) + '\n')
          PY

  build:
    needs: select
    name: ${{ matrix.target }}
    # Never silently start paid private-repo or larger-runner builds.
    # Skip by condition on shots-only runs: an empty matrix skips the job
    # too, but GitHub then concludes the whole run as failed despite
    # every real job passing.
    if: github.event.repository.private == false && inputs.target != 'shots-only'

    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.select.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libxkbcommon-dev libwayland-dev \
            libgl1-mesa-dev libasound2-dev libpipewire-0.3-dev \
            clang libclang-dev cmake perl
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          toolchain=$(python -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          rustup toolchain install "$toolchain" --profile minimal
          rustup target add --toolchain "$toolchain" '${{ matrix.target }}'
          rustc --version
      - name: Launcher and package tests
        shell: bash
        run: python -m unittest discover -s contrib/beeper-tools -p 'test_*.py'
      - name: Type-check native launcher before the Rust build
        if: runner.os == 'macOS'
        shell: bash
        run: xcrun swiftc -swift-version 5 -framework AppKit -typecheck packaging/macos/BeeperLauncher.swift
      - name: Build real release binary
        shell: bash
        run: cargo build --locked --release --bin solmu --target '${{ matrix.target }}'
      - name: Package trial
        shell: bash
        run: |
          python contrib/beeper-tools/package_binary.py \
            --binary 'target/${{ matrix.target }}/release/${{ matrix.executable }}' \
            --output dist --target '${{ matrix.target }}' --commit "$GITHUB_SHA"
      - name: Build scheduler sidecar
        if: matrix.target == 'aarch64-apple-darwin' || matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: cargo build --locked --release --bin solmu-scheduler --target '${{ matrix.target }}'
      - name: Scheduler end-to-end test on Linux (stub Server, no network or accounts)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: contrib/send-later/e2e/run-e2e.sh
      - name: Package native Apple Silicon Finder app and DMG
        if: matrix.target == 'aarch64-apple-darwin'
        shell: bash
        run: |
          python contrib/beeper-tools/package_app_dmg.py \
            --binary 'target/${{ matrix.target }}/release/solmu' \
            --scheduler-binary 'target/${{ matrix.target }}/release/solmu-scheduler' \
            --output app-dist --version 2026.11.4.3 --commit "$GITHUB_SHA"
      # A maintainer enables uploads after checking account storage/no-spend
      # settings. Compilation still runs with this unset, without paid storage.
      - name: Downloadable binary and checksums
        if: vars.FAST_BEEPER_UPLOAD_ARTIFACTS == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Solmu-${{ matrix.target }}-${{ github.sha }}
          path: |
            dist/*.zip
            dist/*.sha256
            app-dist/*.dmg
            app-dist/*.sha256
            app-dist/build-info.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Run summary
        shell: bash
        run: |
          echo 'Explicit urgent trial: compile/package checks, NOT full CI/release acceptance.' >> "$GITHUB_STEP_SUMMARY"
          echo '### Trial binary: ${{ matrix.target }}' >> "$GITHUB_STEP_SUMMARY"
          echo 'Unsigned / unnotarized. Existing Beeper Desktop or Server required. No token or profile bundled.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Artifact uploads require repository variable FAST_BEEPER_UPLOAD_ARTIFACTS=true after storage/budget review.' >> "$GITHUB_STEP_SUMMARY"

  # Rendered-pixel evidence for layout work: demo screenshots of the screens
  # and window sizes the layout tests reason about, as a run artifact (never
  # in the tree, per policy). Runs only on an explicit shots-only dispatch.
  shots:
    name: demo shots (macOS)
    if: ${{ github.event.repository.private == false && inputs.target == 'shots-only' }}
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: jdx/mr-boxington-action@v1
        with:
          cache-generation: test-v1
      - name: Build the demo
        run: mbx build --locked --features demo
      - name: Capture the layouts
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/layout-shots"
          mkdir -p "$out"
          shot() {
            name="$1"; size="$2"; page="$3"; shift 3
            ./target/debug/solmu --demo-shot "$out/$name.png" \
              --demo-size "$size" --demo-page "$page" --demo-shot-delay 6000 "$@"
            test -s "$out/$name.png"
          }
          # The combined sidebar beside the list, and where it must fall
          # back to the compact rail.
          shot chat-1180x780 1180x780 chat
          shot chat-menu-1180x780 1180x780 chat,chat-menu
          shot chat-menu-beeper-1180x780 1180x780 chat,chat-menu-beeper
          # Reply later / Read later: chips in the filter row and the
          # marks on flagged chat rows.
          shot chat-later-1180x780 1180x780 chat,later
          shot chat-960x780 960x780 chat
          shot chat-700x600 700x600 chat
          shot chat-640x780 640x780 chat
          shot chat-600x780 600x780 chat
          # Populated multi-network sidebar: Networks with the active
          # network's accounts, and the Queues section it reveals.
          shot chat-networks-1180x780 1180x780 chat,networks
          shot chat-networks-light-1180x780 1180x780 chat,networks,light
          shot chat-info-networks-1180x780 1180x780 chat,networks,info
          # The linked person: a mixed WhatsApp/Signal timeline, each bubble
          # naming and carrying its source network; the composer pinned at
          # the bottom with the destination control above it.
          shot chat-linked-1180x780 1180x780 chat,linked
          shot chat-receipts-1180x780 1180x780 chat,receipts
          shot chat-receipts-dark-1180x780 1180x780 chat,receipts,theme=Catppuccin.json
          shot chat-linked-dark-1180x780 1180x780 chat,linked,theme=Catppuccin.json
          # A chosen primary: the composer is live, "Sending via" shows.
          shot chat-linked-primary-1180x780 1180x780 chat,linked,linked-primary
          shot chat-linked-primary-info-1180x780 1180x780 chat,linked,linked-primary,info
          shot chat-linked-primary-dark-1180x780 1180x780 chat,linked,linked-primary,theme=Catppuccin.json
          shot chat-linked-reply-dark-1180x780 1180x780 chat,linked,linked-reply,theme=Catppuccin.json
          # A reply routed through a real message: the quote above the composer.
          shot chat-linked-reply-1180x780 1180x780 chat,linked,linked-reply
          # Contact info's link picker mid-search with a checked candidate.
          shot chat-linked-picker-1180x780 1180x780 chat,linked,info,linked-picker
          # The list hidden: the linked view beside the compact rail.
          shot chat-linked-rail-1180x780 1180x780 chat,linked,rail
          shot chat-linked-info-1180x780 1180x780 chat,linked,info
          shot chat-linked-900x780 900x780 chat,linked
          shot chat-linked-info-900x780 900x780 chat,linked,info
          # Composer growth: empty, one line, three lines, past the cap.
          shot composer-one-1180x780 1180x780 chat,draft-one
          shot composer-three-1180x780 1180x780 chat,draft-three
          shot composer-max-1180x780 1180x780 chat,typing
          shot composer-one-dark-1180x780 1180x780 chat,draft-one,theme=Catppuccin.json
          # Bars drawn as while scrolling: against rows and the composer.
          shot bars-linked-1180x780 1180x780 chat,linked,bars
          shot bars-linked-dark-1180x780 1180x780 chat,linked,bars,theme=Catppuccin.json
          shot bars-linked-900x780 900x780 chat,linked,bars,info
          shot bars-chat-1180x780 1180x780 chat,bars
          shot bars-composer-one-1180x780 1180x780 chat,draft-one,bars
          shot bars-composer-max-1180x780 1180x780 chat,typing,bars
          # The viewer upright and turned a quarter clockwise.
          shot viewer-1180x780 1180x780 chat,preview
          shot viewer-rotated-1180x780 1180x780 chat,preview,rotate-view
          shot viewer-rotated-dark-1180x780 1180x780 chat,preview,rotate-view,theme=Catppuccin.json
          # Per-account appearance: the open chat's account draws its
          # conversation with its own theme, then its own background,
          # while the window keeps the global theme.
          shot chat-account-theme-1180x780 1180x780 chat,networks,account-theme
          shot chat-account-background-1180x780 1180x780 chat,networks,account-background
          # A mention chip from bridge metadata: the token carries the
          # sender's label, the chip the name the id resolves to.
          shot chat-mentions-1180x780 1180x780 chat,mentions
          shot chat-dark-mentions-1180x780 1180x780 chat,mentions,theme=Catppuccin.json
          # A transcribed voice note: the transcript wraps under the player.
          shot chat-transcript-1180x780 1180x780 chat,transcript
          shot chat-dark-transcript-1180x780 1180x780 chat,transcript,theme=Catppuccin.json
          # The per-message language dialog over the fixture voice note.
          shot chat-transcription-language-1180x780 1180x780 chat,transcript,transcription-language
          # The same populated sidebar on a dark preset.
          shot chat-dark-networks-1180x780 1180x780 chat,networks,theme=Catppuccin.json
          # The populated rail scrolled to its end: Pinned and the bottom
          # destinations stay reachable by scrolling at this height.
          shot chat-networks-scrolled-1180x780 1180x780 chat,networks,rail-bottom
          shot chat-dark-networks-scrolled-1180x780 1180x780 chat,networks,theme=Catppuccin.json,rail-bottom
          # A short window, fully populated rail: filters, queues, labels,
          # favorites, pins and networks stay one icon column; the rail's
          # own scroll reaches its end without touching the list's scroll.
          shot chat-rail-full-700x600 700x600 chat,rail-full
          shot chat-rail-full-scrolled-700x600 700x600 chat,rail-full,rail-bottom
          # The list hidden: avatars fill the compact rail.
          shot rail-1180x780 1180x780 rail
          # Settings keeps its old content width beside the compact rail.
          shot settings-960x780 960x780 settings
          # Transcription settings: the local-service fields and the
          # delete control, found by the settings search.
          shot settings-transcription-960x780 960x780 settings-search=Transcription,transcript
          # Solmu's own title bar (GNOME): the header clears the buttons.
          shot chat-titlebar-700x600 700x600 chat --demo-titlebar
          # A short window scrolls the rail instead of losing its foot.
          shot chat-1180x300 1180x300 chat
      - uses: actions/upload-artifact@v7
        with:
          name: layout-shots
          path: ${{ runner.temp }}/layout-shots/*.png
          retention-days: 7
