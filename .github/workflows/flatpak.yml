name: Flatpak

on:
  push:
    branches: [main]
    paths: [packaging/flatpak/**, .github/workflows/flatpak.yml, Cargo.lock, Cargo.toml]
  pull_request:
    paths: [packaging/flatpak/**, .github/workflows/flatpak.yml, Cargo.lock, Cargo.toml]
  workflow_dispatch:

permissions:
  contents: read

# Superseded checks should not continue their full hour-long build.
concurrency:
  group: flatpak-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    name: Select build need
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.scope.outputs.build }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Skip pure release-metadata diffs
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            echo 'build=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE" "$HEAD" | grep -qx '.github/workflows/flatpak.yml'; then
            echo 'build=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 .github/scripts/ci-scope.py --base "$BASE" --head "$HEAD" --output /tmp/flatpak-scope
          grep '^nix=' /tmp/flatpak-scope | sed 's/^nix=/build=/' >> "$GITHUB_OUTPUT"
  build:
    needs: scope
    if: needs.scope.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - uses: actions/checkout@v7
      - name: Generate offline Cargo sources
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 -m venv /tmp/flatpak-generator
          /tmp/flatpak-generator/bin/pip install aiohttp tomlkit PyYAML
          PATH="/tmp/flatpak-generator/bin:$PATH" python3 packaging/flatpak/test-packaging.py
          PATH="/tmp/flatpak-generator/bin:$PATH" packaging/flatpak/flathub.sh HEAD /tmp/zapfast-flathub
          cp /tmp/zapfast-flathub/cargo-sources.json packaging/flatpak/
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: packaging/flatpak/rocks.zapfast.ZapFast.yml
          bundle: zapfast-test-x86_64.flatpak
          cache: false
          upload-artifact: ${{ vars.FAST_BEEPER_UPLOAD_ARTIFACTS == 'true' }}
