[package]
name = "signin-check"
version = "0.1.0"
edition = "2024"
[dependencies]
egui = "0.36.2"
serde_json = "1"
zeroize = "1"
keyring-core = "1"
zbus-secret-service-keyring-store = { version = "1.0.1", features = ["rt-tokio-crypto-rust"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
